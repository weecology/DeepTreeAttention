# Config — paths below default to UF HiPerGator shared storage. For a portable checkout,
# copy to ``config.local.yml`` (untracked) or override globs to point under ``data/external/neon_aop/``.

# Vegetation structure (stem) table used by ``train.py`` when building a new dataset
raw_vst_csv: data/raw/neon_vst_data_2022.csv

# When ``use_data_commit`` points at a bundle with split CSVs like ``train_<hash>_[\"OSBS\"].csv``, set these
# (relative to the commit directory unless absolute). Default null uses ``train.csv`` / ``test.csv``.
processed_train_csv: null
processed_test_csv: null

# Optional layout for reproducible local mirrors (see README and ``data/raw/README.md``)
data_layout:
  sensor_download_root: data/external/neon_aop
  # After running the filter stage, point downloads here:
  canopy_points_shp: null

# NEON AOP API downloads (``neonutilities.by_tile_aop``). Requires ``NEON_API_TOKEN`` for large pulls.
neon_download:
  site: OSBS
  years: [2021, 2022]
  buffer_m: 50
  check_size: false
  token_env: NEON_API_TOKEN
  save_root: data/external/neon_aop
  products:
    rgb: DP3.30010.001
    hsi: DP3.30006.001
    chm: DP3.30015.001

### Data Generation
#glob path to sensor data, recursive wildcards allowed
rgb_sensor_pool: /orange/ewhite/NeonData/OSBS/DP3.30010.001/**/Camera/**/*.tif 
HSI_sensor_pool: /orange/ewhite/NeonData/OSBS/DP3.30006.001/**/Reflectance/*.h5
CHM_pool: /orange/ewhite/NeonData/**/CanopyHeightModelGtif/*.tif
HSI_tif_dir: /orange/idtrees-collab/Hyperspectral_tifs/year/

#NEON data filtering
min_stem_diameter: 10

#Minimum number of test samples per class to be included
min_train_samples: 10
min_test_samples: 10

#Iterations to search for the best train-test split that mantains the largest number of species. Set to 1 for debugging, no files will be written
iterations: 100

#minimum CHM height, leave blank to skip CHM filtering
min_CHM_height: 1
#Max difference between measured height and CHM height if CHM > height
max_CHM_diff: 4
#Max difference between measured height and CHM height if CHM < height
CHM_height_limit: 8

#Megaplot XY Data, these are .shp files saved as the siteID
megaplot_dir: /orange/idtrees-collab/megaplot/

#Crop generation, whether to make a new dataset and customize which parts to recreate
#Checkout data artifact from comet
use_data_commit: 4c02ae98bd774aa494fadb3508ae84ba

#Make new dataset
data_dir: data/processed
convert_h5: True
#Overwrite existing crops
replace: True
#Use existing plotIDs for train/test split
new_train_test_split: True

#How many samples from non-osbs sites can we use per species
samples_from_other_sites: 0
oaks_sampling_ceiling: 200
other_sampling_ceiling: 500
evergreen_ceiling: 70

# Data loader
#resized Pixel size of the crowns. Square crops around each pixel of size x are used
image_size: 11
preload_images: False
workers: 20
sampling_ceiling: 200
#Network Parameters
pretrain_state_dict:

# Lightning 2 Trainer: prefer ``devices`` + ``accelerator`` (``gpus`` still supported as a devices count).
devices: 1
batch_size: 128
bands: 349

#LR for each level x year
lr_0: 0.000001
lr_1: 0.000001
lr_2: 0.000005
lr_3: 0.0001
lr_4: 0.000005

fast_dev_run: False
accelerator: auto
epochs: 70
min_loss_weight: 10

# Optional Lightning caps (null = full run). See config.smoke.example.yml for workflow smoke tests.
limit_train_batches: null
limit_val_batches: null
limit_predict_batches: null
checkpoint_dir: results/checkpoints
use_comet: true

#Evaluation config
#Top k class recall score
top_k: 4
#Number of individuals to plot in comet graphics tab
plot_n_individuals: 0

#Predict
predict_batch_size: 64
dead_threshold: 0.95
prediction_crop_dir: results/prediction_crops/
# Optional DeepForest CropModel for alive/dead labels at crown-detection time
deepforest_dead_cropmodel_name: weecology/cropmodel-deadtrees

#Comet dashboard
comet_workspace: bw4sz

# OSBS RGB inference (all tiles for ``year`` under rgb_sensor_pool that intersect AOI)
# Run: python -m src.pipelines.osbs_inference --config config.yml
inference_osbs:
  site: OSBS
  year: 2025
  species_checkpoint: /blue/ewhite/b.weinstein/DeepTreeAttention/snapshots/121d61eefcd848dc97cc52bc82012c3b_OSBS.pt
  aoi_path: data/raw/OSBSBoundary/OSBS_boundary.shp
  results_root: /blue/ewhite/b.weinstein/DeepTreeAttention/results/osbs_inference/
  # Optional: cap tiles for debugging (omit or null for all AOI-intersecting tiles)
  tile_limit: null
  # Optional: cap species-model predict batches per tile (Lightning Trainer)
  predict_limit_batches: null
  # Optional legacy Lightning alive/dead checkpoint (otherwise DeepForest cropmodel from deepforest_dead_cropmodel_name is used when present)
  dead_model_path: null
  filter_dead: true

## Alive Dead Model Training
dead:
    train_dir: data/raw/dead_train/
    test_dir: data/raw/dead_test/
    epochs: 40
    lr: 0.0001
    savedir: /orange/idtrees-collab/DeepTreeAttention/Dead/snapshots/
    batch_size: 128
    num_workers: 0
